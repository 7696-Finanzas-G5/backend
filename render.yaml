# Blueprint de Render: backend CrediBarrio (Docker) con base de datos en Aiven PostgreSQL.
# Render > New > Blueprint > seleccione este repositorio (rama main).
# Al crear el Blueprint, Render pedirá DB_URL: pegue la "Service URI" de Aiven
#   postgres://avnadmin:<clave>@<host>.aivencloud.com:<puerto>/defaultdb?sslmode=require
services:
  - type: web
    name: credibarrio-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Service URI de Aiven (incluye usuario, clave y sslmode=require). No se guarda en el repositorio.
      - key: DB_URL
        sync: false
      # Conexiones simultáneas a la base (el plan gratuito de Aiven admite pocas)
      - key: DB_POOL_SIZE
        value: "5"
      # Clave HMAC del JWT generada por Render (no se guarda en el repositorio)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "8"
      # Origen del frontend en Vercel. Se recomienda reemplazar el patrón por la URL exacta
      # (p. ej. https://frontend-finanzas.vercel.app); separe varios orígenes con comas.
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:4200
      # Carga los datos de demostración solo si la base está vacía
      - key: SEED_DEMO_DATA
        value: "true"
