# Blueprint de Render: backend CrediBarrio (Docker) + PostgreSQL gestionado.
# Render > New > Blueprint > seleccione este repositorio (rama main).
services:
  - type: web
    name: credibarrio-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: credibarrio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: credibarrio-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: credibarrio-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: credibarrio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: credibarrio-db
          property: password
      # Clave HMAC del JWT generada por Render (no se guarda en el repositorio)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "8"
      # Origen del frontend en Vercel. Se recomienda reemplazar el patrón por la URL exacta
      # (p. ej. https://frontend-finanzas.vercel.app); separe varios orígenes con comas.
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:4200
      # Carga los datos de demostración solo si la base está vacía
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: credibarrio-db
    plan: free
    region: oregon
    databaseName: credibarrio
    user: credibarrio
