spring:
  application:
    name: credibarrio-backend
  datasource:
    url: jdbc:h2:file:./data/credibarrio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

credibarrio:
  jwt:
    # Cambiar en producción (variable de entorno JWT_SECRET, mínimo 32 caracteres)
    secret: ${JWT_SECRET:credibarrio-dev-secret-cambiar-en-produccion-2026}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  cors:
    # Angular (ng serve) por defecto; varios orígenes separados por coma
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/credibarrio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  h2:
    console:
      enabled: false
